name: CI TEST
on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: test_container_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --tmpfs /var/lib/mysql
    env:
      SPRING_PROFILES_ACTIVE: ci
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/test_container_test?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v3

      - name: 자바 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          # temurin 은 러너 이미지에 깔린 JDK 를 쓴다. 같은 버전(17.0.20.1)을 매번 새로 받는 adopt 보다
          # CI 빌드가 평균 87초(26%) 느렸다 (#744 에서 같은 시각 짝 A/B). 원인은 못 가렸다
          distribution: 'adopt'
          cache: 'gradle'

      - name: MySQL 서비스 상태 확인
        run: |
          timeout 60 bash -c 'until echo > /dev/tcp/127.0.0.1/3306; do sleep 2; done'

      - name: 빌드 (실패 시 1회 재시도)
        run: |
          set +e
          ./gradlew --no-daemon test --stacktrace --quiet
          first_result=$?
          if [ "$first_result" -ne 0 ]; then
            echo "첫 번째 테스트 실행 실패. 1회 재시도합니다."
            ./gradlew --no-daemon test --stacktrace --quiet
            second_result=$?
            if [ "$second_result" -ne 0 ]; then
              exit "$second_result"
            fi
          fi

      - name: API 문서 누락 검사
        if: success()
        run: bash scripts/check-api-docs.sh
