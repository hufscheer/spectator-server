name: spring server cd

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]

# develop 에 연달아 머지되면 배포 두 개가 겹쳐 같은 :dev 이미지 태그를 덮어써, 옛 커밋이 뜰 수 있었다.
# 같은 브랜치의 배포는 하나씩 돈다. 진행 중인 배포는 끊지 않고, 기다리던 배포는 가장 최신 것 하나만 남는다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.ACTION_TOKEN }}

      - name: 자바 17 설정
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: 'gradle'

      # 전체 테스트는 PR CI 를 통과해야 develop·main 에 머지된다(브랜치 보호). 여기서 또 돌리면 배포가 6분 넘게 늦어진다.
      # bootJar 는 asciidoctor → test 에 묶여 있어 테스트를 아예 빼면 /docs/api.html 이 빈 채로 나간다.
      # 그래서 API 문서를 만드는 문서 테스트(DocumentationTest 를 상속한 *ControllerTest, DB 없음)만 돌린다
      - name: 빌드
        run: ./gradlew test --tests '*ControllerTest' bootJar

      - name: 환경 결정
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TARGET=prod" >> $GITHUB_OUTPUT
            echo "HOST=${{ secrets.WAS_HOST }}" >> $GITHUB_OUTPUT
            echo "KEY_SECRET=KEY" >> $GITHUB_OUTPUT
            echo "IMG=${{ secrets.DOCKER_IMG }}" >> $GITHUB_OUTPUT
            echo "COMPOSE=docker-compose.yml" >> $GITHUB_OUTPUT
          else
            echo "TARGET=dev" >> $GITHUB_OUTPUT
            echo "HOST=${{ secrets.WAS_HOST_DEV }}" >> $GITHUB_OUTPUT
            echo "KEY_SECRET=KEY_DEV" >> $GITHUB_OUTPUT
            echo "IMG=${{ secrets.DOCKER_IMG_DEV }}:dev" >> $GITHUB_OUTPUT
            echo "COMPOSE=docker-compose.dev.yml" >> $GITHUB_OUTPUT
          fi

      - name: 도커 이미지 빌드
        run: docker build -t ${{ steps.env.outputs.IMG }} .

      - name: Docker Hub 로그인
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Hub push
        run: docker push ${{ steps.env.outputs.IMG }}

      - name: scp be-config docker (prod)
        if: steps.env.outputs.TARGET == 'prod'
        uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # 2026-08-09 master (drone-scp 1.8.0)
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          source: "./src/main/resources/be-config/docker/"
          target: "/home/ubuntu/staging"
          strip_components: 6

      - name: 배포 (prod, blue/green)
        if: steps.env.outputs.TARGET == 'prod'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          script: |
            set -e
            cd /home/ubuntu

            cp /home/ubuntu/staging/docker-compose.yml /home/ubuntu/docker-compose.yml
            cp /home/ubuntu/staging/deploy.sh /home/ubuntu/deploy.sh
            chmod +x /home/ubuntu/deploy.sh

            mkdir -p /home/ubuntu/nginx/conf.d /home/ubuntu/nginx/templates
            cp /home/ubuntu/staging/nginx/blue.conf /home/ubuntu/nginx/templates/blue.conf
            cp /home/ubuntu/staging/nginx/green.conf /home/ubuntu/nginx/templates/green.conf

            if [ ! -f /home/ubuntu/nginx/conf.d/default.conf ] || [ -L /home/ubuntu/nginx/conf.d/default.conf ]; then
                rm -f /home/ubuntu/nginx/conf.d/default.conf
                cp /home/ubuntu/nginx/templates/blue.conf /home/ubuntu/nginx/conf.d/default.conf
            fi

            if docker ps --format '{{.Names}}' | grep -q '^hufscheer-server$'; then
                echo "[cutover] removing legacy hufscheer-server"
                docker stop hufscheer-server || true
                docker rm hufscheer-server || true
            fi

            if [ ! -f /home/ubuntu/.active_slot ]; then
                echo green > /home/ubuntu/.active_slot
            fi

            docker compose -f docker-compose.yml up -d router

            bash /home/ubuntu/deploy.sh

      - name: scp docker-compose (dev)
        if: steps.env.outputs.TARGET == 'dev'
        uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # 2026-08-09 master (drone-scp 1.8.0)
        with:
          host: ${{ secrets.WAS_HOST_DEV }}
          username: ubuntu
          key: ${{ secrets.KEY_DEV }}
          source: "./src/main/resources/be-config/docker/docker-compose.dev.yml"
          target: "/home/ubuntu"
          strip_components: 6

      - name: 배포 (dev)
        if: steps.env.outputs.TARGET == 'dev'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.WAS_HOST_DEV }}
          username: ubuntu
          key: ${{ secrets.KEY_DEV }}
          script: |
            set -e
            docker pull ${{ steps.env.outputs.IMG }}
            DOCKER_IMG=${{ steps.env.outputs.IMG }} docker compose -f docker-compose.dev.yml up -d --force-recreate
            docker image prune -f

            # 컨테이너가 떠도 앱이 죽으면 배포가 성공으로 끝났다(11/11 #792 dev 크래시 루프 때 CD success).
            # prod deploy.sh 처럼 Docker 헬스가 healthy 가 될 때까지 기다리고, 아니면 job 을 실패시킨다.
            # 헬스체크 주기가 30초라 첫 판정이 30초 뒤에 나오므로 최대 180초 기다린다.
            # 공개 레포라 실패해도 앱 로그는 찍지 않는다(서버에서 docker logs 로 본다).
            C=hufscheer-server-dev
            for i in $(seq 1 90); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$C" 2>/dev/null) || STATUS=missing
              RESTARTS=$(docker inspect --format='{{.RestartCount}}' "$C" 2>/dev/null) || RESTARTS=0
              if [ "$STATUS" = healthy ]; then
                echo "[deploy] $C healthy after $((i*2))s"
                exit 0
              fi
              if [ "$STATUS" = unhealthy ] || [ "$RESTARTS" -gt 0 ]; then
                echo "[deploy] FAILED: $C status=$STATUS restarts=$RESTARTS"
                exit 1
              fi
              sleep 2
            done
            echo "[deploy] FAILED: $C not healthy after 180s (status=$STATUS)"
            exit 1

      # 배포가 실패해도 아무도 몰라 7/17~8/13 두 달간 운영에 수정이 안 나갔다. 어느 단계든 실패하면 Slack 에 알린다.
      - name: 실패 알림 (Slack)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CD_SLACK_WEBHOOK_URL }}
          TARGET: ${{ steps.env.outputs.TARGET || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "CD_SLACK_WEBHOOK_URL 이 없어 알림을 건너뛴다"
            exit 0
          fi
          TITLE=$(printf '%s' "$COMMIT_MSG" | head -n1)
          TEXT=$(printf '[CD 실패] spectator-server %s 배포 (%s, %s)\n%s\n%s' \
            "$TARGET" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" "${TITLE:-$GITHUB_EVENT_NAME}" "$RUN_URL")
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
