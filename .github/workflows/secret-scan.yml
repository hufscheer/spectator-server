name: Secret Scan

# 커밋에 비밀키(AWS 키, 토큰 등)가 들어갔는지 gitleaks 로 검사한다.
# gitleaks-action 은 조직 레포에서 라이선스 키(GITLEAKS_LICENSE)를 요구하므로,
# MIT 라이선스인 gitleaks CLI 를 직접 받아 체크섬을 확인한 뒤 실행한다.
# 히스토리 전체(약 9MB)를 스캔해도 1초 안팎이라 매번 전체를 본다.
# 오탐은 .gitleaks.toml 의 allowlist 에 경로와 줄 내용을 함께 묶어 좁게 추가한다.
on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: 저장소 Checkout (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks 설치
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks" version

      - name: 비밀키 검사 (전체 히스토리)
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --no-banner \
            --verbose
