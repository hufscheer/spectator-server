plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.4'
    id 'io.spring.dependency-management' version '1.1.3'
    id "org.asciidoctor.jvm.convert" version '3.3.2'
    id 'jacoco'
}

configurations {
    asciidoctorExt
}

group = 'com.sports'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.rest-assured:rest-assured'

    implementation 'org.springframework.boot:spring-boot-starter-aop'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // JPA & Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'mysql:mysql-connector-java:8.0.32'
    runtimeOnly 'com.h2database:h2'

    // flyway
    implementation 'org.flywaydb:flyway-core:9.1.3'
    implementation 'org.flywaydb:flyway-mysql:9.1.3'

    // in-memory cache (rate limit, dedup, masking response)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // querydsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // structured logging (JSON)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // TestContainer
    testImplementation "org.testcontainers:testcontainers:1.19.3"
    testImplementation "org.testcontainers:junit-jupiter:1.19.3"
    testImplementation "org.testcontainers:mysql:1.19.3"

    // rest docs
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

    // spring security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jwt
    implementation 'com.auth0:java-jwt:4.4.0'

    // aws
    implementation('com.amazonaws:aws-java-sdk-s3:1.12.395') {
        // 스프링은 같은 패키지를 spring-jcl 로 준다. spring-cloud-starter-aws 를 쓸 때도 빠져 있었다
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    // image normalization (team logo aspect ratio fix)
    implementation 'net.coobird:thumbnailator:0.4.20'

    // fixture
    testImplementation("com.navercorp.fixturemonkey:fixture-monkey-starter:1.0.21")
}

ext {
    snippetsDir = file('build/generated-snippets')
}

test {
    outputs.dir snippetsDir
    // 앱은 main() 에서 시간대를 Asia/Seoul 로 정하지만 테스트는 main() 을 거치지 않아 기계 시간대를 따른다.
    // ci 프로파일은 serverTimezone=UTC 로 읽어서, KST 기계에서는 SQL 픽스처의 시각이 9시간 밀려 CI(UTC)와 결과가 달랐다
    systemProperty 'user.timezone', 'UTC'
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
    // Gradle 기본 512m 에서는 캐시된 스프링 컨텍스트들로 GC 뒤에도 힙이 거의 찬다(최대 510MB, Full GC 9번).
    // CI 에서 톰캣 스레드가 OutOfMemoryError 로 죽은 적이 있다
    maxHeapSize = '1g'
    testLogging {
        events "failed" // 실패한 테스트만 로그 출력
        exceptionFormat "full" // Expected vs Actual 포함
        showStandardStreams = false

        // 실패한 테스트에서만 Expected vs Actual을 출력
        afterTest { desc, result ->
            if (result.resultType == TestResult.ResultType.FAILURE) {
                println("🔴 FAILED TEST: " + desc.getDisplayName())
                println("======================================")
                result.exception?.printStackTrace() // 실패한 테스트의 상세 오류 출력
                println("======================================")
            }
        }
    }
}

// CI 에서 테스트 클래스를 여러 잡으로 나눠 동시에 돌린다: ./gradlew test -PtestShards=3 -PtestShard=0
// .github/test-timings.txt(클래스 이름과 초)가 있으면 시간이 고르게 나뉘게 담고, 기록이 없는 클래스는 이름 해시로 나눈다.
// @Nested 클래스(Outer$Inner)는 바깥 클래스와 같은 잡에 둔다
if (project.hasProperty('testShards')) {
    int shards = (project.property('testShards') as String).toInteger()
    int shard = (project.property('testShard') as String).toInteger()
    Map<String, Integer> assigned = [:]
    def timingsFile = file('.github/test-timings.txt')
    if (timingsFile.exists()) {
        double[] load = new double[shards]
        timingsFile.readLines()
                .findAll { it.trim() && !it.startsWith('#') }
                .collect { it.trim().split(/\s+/) }
                .sort { a, b -> ((b[1] as double) <=> (a[1] as double)) ?: (a[0] <=> b[0]) }
                .each { row ->
                    int lightest = (0..<shards).min { load[it] }
                    assigned[row[0]] = lightest
                    load[lightest] += row[1] as double
                }
    }
    test {
        exclude { FileTreeElement element ->
            if (element.directory || !element.name.endsWith('.class')) return false
            String outer = element.relativePath.pathString.replaceAll(/(\$.*)?\.class$/, '').replace('/', '.')
            int target = assigned.containsKey(outer) ? assigned[outer] : Math.floorMod(outer.hashCode(), shards)
            target != shard
        }
    }
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

asciidoctor {
    configurations 'asciidoctorExt'
    inputs.dir snippetsDir
    dependsOn test
}

bootJar {
    dependsOn asciidoctor
    from('build/docs/asciidoc') {
        into 'static/docs'
    }
}
