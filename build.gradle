plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.asciidoctor.jvm.convert" version '4.0.5'
    id 'jacoco'
}

configurations {
    asciidoctorExt
}

group = 'com.sports'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    // Boot 4 에서 spring-boot-starter-web 은 deprecated, 같은 내용의 webmvc 로 바뀌었다
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Boot 4 는 기술별 테스트 starter 로 나뉜다(@WebMvcTest, @AutoConfigureMockMvc, @DataJpaTest, REST Docs 자동설정)
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    // Boot 4 BOM 은 rest-assured 를 관리하지 않는다. 5.x 는 Boot 4 의 Groovy 5 위에서 깨진다
    testImplementation 'io.rest-assured:rest-assured:6.3.0'

    // Boot 4 에서 spring-boot-starter-aop 의 새 이름. @Aspect(TimeLogAspect) 를 쓴다
    implementation 'org.springframework.boot:spring-boot-starter-aspectj'

    // WebClient 만 쓴다(OpenRouter, Gemini, FCM, Slack). Boot 4 는 WebClient 를 webflux 와 따로 둔다
    implementation 'org.springframework.boot:spring-boot-starter-webclient'

    // JPA & Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    // flyway
    // Boot 4 는 Flyway 자동설정을 starter 로만 켠다. flyway-core 만 두면 마이그레이션이 돌지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'

    // in-memory cache (rate limit, dedup, masking response)
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // querydsl
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // monitoring
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // structured logging (JSON)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // TestContainer
    // Testcontainers 2 에서 모듈 이름에 testcontainers- 접두사가 붙었다
    testImplementation "org.testcontainers:testcontainers"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter"
    testImplementation "org.testcontainers:testcontainers-mysql"

    // rest docs
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

    // spring security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // jwt
    implementation 'com.auth0:java-jwt:4.4.0'

    // aws
    implementation('com.amazonaws:aws-java-sdk-s3:1.12.395') {
        // 스프링은 같은 패키지를 spring-jcl 로 준다. spring-cloud-starter-aws 를 쓸 때도 빠져 있었다
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    // FCM HTTP v1 인증 (firebase-admin 은 무거워서 쓰지 않는다)
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.54.0'

    // image normalization (team logo aspect ratio fix)
    implementation 'net.coobird:thumbnailator:0.4.20'
    // 정규화본을 WebP 로 쓴다. ImageIO 에는 WebP 인코더가 없다. libwebp 를 묶은 네이티브(JNI)라
    // glibc 용 .so 지만 eclipse-temurin:17-jre-alpine(musl, amd64)에서도 그대로 로드된다(2026-11-07 컨테이너 실측)
    implementation 'com.github.usefulness:webp-imageio:0.11.0'

    // NL 파일 추출 (xlsx 셀 읽기, PDF 텍스트 레이어 추출)
    implementation 'org.dhatim:fastexcel-reader:0.20.2'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    // fixture
    testImplementation("com.navercorp.fixturemonkey:fixture-monkey-starter:1.0.21")
}

ext {
    snippetsDir = file('build/generated-snippets')
}

test {
    outputs.dir snippetsDir
    // 앱은 main() 에서 시간대를 Asia/Seoul 로 정하지만 테스트는 main() 을 거치지 않아 기계 시간대를 따른다.
    // ci 프로파일은 serverTimezone=UTC 로 읽어서, KST 기계에서는 SQL 픽스처의 시각이 9시간 밀려 CI(UTC)와 결과가 달랐다
    systemProperty 'user.timezone', 'UTC'
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
    // Gradle 기본 512m 에서는 캐시된 스프링 컨텍스트들로 GC 뒤에도 힙이 거의 찬다(최대 510MB, Full GC 9번).
    // CI 에서 톰캣 스레드가 OutOfMemoryError 로 죽은 적이 있다
    maxHeapSize = '1g'
    testLogging {
        events "failed" // 실패한 테스트만 로그 출력
        exceptionFormat = "full" // Expected vs Actual 포함
        showStandardStreams = false

        // 실패한 테스트에서만 Expected vs Actual을 출력
        afterTest { desc, result ->
            if (result.resultType == TestResult.ResultType.FAILURE) {
                println("🔴 FAILED TEST: " + desc.getDisplayName())
                println("======================================")
                result.exception?.printStackTrace() // 실패한 테스트의 상세 오류 출력
                println("======================================")
            }
        }
    }
}

jacoco {
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// REST Docs 4 의 asciidoctor 확장은 AsciidoctorJ 3 API 로 빌드되어 있다. 플러그인 기본값(2.5)으로는 문서 생성이 AbstractMethodError 로 실패한다
asciidoctorj {
    version = '3.0.1'
}

asciidoctor {
    configurations 'asciidoctorExt'
    inputs.dir snippetsDir
    dependsOn test
}

bootJar {
    dependsOn asciidoctor
    from('build/docs/asciidoc') {
        into 'static/docs'
    }
}
