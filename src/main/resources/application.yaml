spring:
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      # Hibernate 7 은 클래스패스에 Jackson 2 가 있으면(aws sdk, logstash encoder 가 끌어옴) JSON 컬럼에 Jackson 2 를 먼저 쓴다.
      # 엔티티의 JsonNode 는 Jackson 3 타입이라 Jackson 3 매퍼로 고정한다
      hibernate.type.json_format_mapper: jackson3
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
  # Boot 4 는 Jackson 3 을 쓴다. Jackson 3 기본값은 필드를 알파벳순으로 쓰고, 원시 타입 필드에 null 이 오면 400 을 낸다.
  # 응답과 요청 해석을 Boot 3 과 같게 두려고 Jackson 2 기본값을 쓴다
  jackson:
    use-jackson2-defaults: true
    mapper:
      # Jackson 2 기본값은 생성자 파라미터 이름 감지를 끈다. Boot 3 은 ParameterNamesModule 로 이것을 켜 두었고,
      # @JsonCreator 없는 생성자로 받는 요청 DTO(TimelineRequest 의 하위 타입 등)가 여기에 기댄다
      detect-parameter-names: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # 업로드가 한도(10MB)를 넘으면 톰캣이 본문을 다 읽지 않고 연결을 끊어 클라이언트가 400 JSON 대신 reset 을 본다.
    # 이 크기까지는 버리며 읽어 줘서 400 응답이 전달되게 한다
    max-swallow-size: 20MB
    mbeanregistry:
      enabled: true

push:
  fcm:
    enabled: false
    credentials-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: "prometheus,health"
  metrics:
    tags:
      application: hufscheer-server

---
spring:
  config:
    activate:
      on-profile: local
    import: application-local.yml

---
spring:
  config:
    activate:
      on-profile: ci
    import: application-ci.yml

---
spring:
  config:
    activate:
      on-profile: prod
    import:
      - classpath:be-config/application-prod.yml

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - classpath:be-config/application-dev.yml
